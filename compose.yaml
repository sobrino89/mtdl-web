# mtdl-web mit Docker Compose. Pfade links vom Doppelpunkt anpassen, dann: docker compose up -d
# Unraid: compose.unraid.yaml. Weitere Einstellungen: .env.example nach .env kopieren und dort einschalten.
# Anleitung: https://sobrino89.github.io/mtdl-web/getting-started/quickstart/
services:
  mtdl-web:
    image: ghcr.io/sobrino89/mtdl-web:latest  # latest: neueste Version; 0.1 bliebe bei 0.1.x
    container_name: mtdl-web
    # user: "1000:1000"                       # statt PUID/PGID: ganz ohne root (config-Ordner muss ihm gehören)
    security_opt:
      - no-new-privileges:true                # kein Prozess im Container kann sich mehr Rechte holen
    environment:
      PUID: "1000"                            # Benutzer, dem die Dateien gehören sollen (id -u)
      PGID: "1000"                            # seine Gruppe (id -g)
      UMASK: "022"                            # Rechte neuer Dateien: 022 = nur der Besitzer schreibt
      TZ: Europe/Berlin                       # Zeitzone für Sendetage und Anzeigen
    env_file:
      - path: .env                            # weitere Einstellungen, optional (Vorlage: .env.example)
        required: false
    volumes:
      - ./config:/config                      # Zustand und Cache (Cache rund 1 GB, gehört nicht ins Backup)
      - /pfad/zu/downloads:/downloads         # Download-Ordner
      # Bibliotheken für Plex oder Jellyfin, je Ordner ein Mount, anlegen in den Einstellungen:
      # - /pfad/zu/serien:/library/shows
      # - /pfad/zu/filme:/library/movies
    ports:
      - "8080:8080"                           # Oberfläche, API und MCP-Server
    restart: unless-stopped
